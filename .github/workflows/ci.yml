name: S3 website deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      AWS_ROLE_ARN: arn:aws:iam::108782090284:role/role1
      

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: role1-s3-deploy
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Upload repository-root index.html to S3
        run: aws s3 cp ../index.html "s3://${S3_BUCKET_NAME}/index.html" --region "${AWS_REGION}"