<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple website deployed automatically with GitHub Actions and Amazon S3.">
    <title>Welcome | CI/CD Website</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f6fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(42rem, calc(100% - 3rem));
        padding: 3rem;
        border: 1px solid #e1e7f0;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1rem 3rem rgb(23 32 51 / 8%);
      }

      p {
        color: #526078;
        line-height: 1.7;
      }

      .eyebrow {
        color: #176b55;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Continuous delivery</p>
      <h1>Welcome to the website</h1>
      <p>
        This page is published to Amazon S3 automatically whenever a change is
        pushed to the default branch.
      </p>
    </main>
  </body>
</html>
